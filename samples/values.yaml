# Set by the ApplicationSet from the cluster label upbound.io/controlplane.
controlPlane: ""
namespace: default

azure:
  # Tenant namespace for the Azure XRs. The AKS kubeconfig Secret (<xr-name>-akscluster)
  # lands here, because a namespaced MR writes its connection Secret to its own namespace.
  # The namespace, its azure-creds Secret and its ProviderConfig come from outside this chart.
  namespace: team-a
  # Azure ProviderConfig the XRs use. Set per cluster from the Akuity label
  # upbound.io/azure-providerconfig ("wi" = workload identity, no client secret).
  providerConfigName: default
  region: eastus
  addressRange: 10.10.0.0/16
  generalSubnetRange: 10.10.1.0/24
  aks:
    enabled: true
    version: "1.34"
    nodeCount: 1
    instanceType: Standard_B2s

http:
  # Static fake REST API with fixed resources (/posts/1, /todos/1).
  healthyBaseUrl: https://jsonplaceholder.typicode.com
  # .invalid is reserved (RFC 6761) and never resolves, so this request always fails.
  failingBaseUrl: https://does-not-exist.invalid
  disposableInterval: 2m
