# Tenant environment env-a of dedicated control plane ctp-ded1.
---
apiVersion: azure.platform.upbound.io/v1alpha1
kind: Network
metadata: {name: re-ded1-a, namespace: env-a}
spec:
  parameters:
    id: re-ded1-a
    region: eastus
    addressRange: 10.24.0.0/16
    generalSubnetRange: 10.24.1.0/24
    managementPolicies: ["Create", "Observe", "Update", "LateInitialize"]
    providerConfigName: default
---
apiVersion: azure.platform.upbound.io/v1alpha1
kind: AKS
metadata: {name: re-ded1-a, namespace: env-a}
spec:
  parameters:
    id: re-ded1-a
    region: eastus
    version: "1.34"
    managementPolicies: ["Create", "Observe", "Update", "LateInitialize"]
    providerConfigName: default
    nodes: {count: 1, instanceType: Standard_B2s}
